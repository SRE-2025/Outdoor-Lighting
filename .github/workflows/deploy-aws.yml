name: Deploy to AWS (S3 + CloudFront)

# DORMANT UNTIL ACTIVATED — this job is skipped until you flip it on.
#
# When your domain is ready and you've created the S3 bucket + CloudFront
# distribution, add these in Repo → Settings:
#   Secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
#              S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID
#   Variables: AWS_REGION (e.g. us-east-1)
#              AWS_DEPLOY_ENABLED = true   <-- this switch turns the deploy on
#
# Until AWS_DEPLOY_ENABLED == 'true', the deploy job is skipped, so this
# workflow never fails while you're still on GitHub-only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build site (served at domain root)
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        run: |
          # Long-cache the fingerprint-safe assets, no-cache the HTML.
          aws s3 sync _site "s3://${{ secrets.S3_BUCKET }}" \
            --delete \
            --exclude "*.html" \
            --exclude "sitemap.xml" \
            --exclude "robots.txt" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync _site "s3://${{ secrets.S3_BUCKET }}" \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --include "sitemap.xml" \
            --include "robots.txt" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
