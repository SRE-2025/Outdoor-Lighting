name: Build & publish to gh-pages

# Builds the Eleventy site and publishes it to the `gh-pages` branch on every
# push. This uses normal contents:write (which the token has) instead of the
# Pages enablement API (which the org blocks), so it works without special setup.
#
# ONE-TIME: Repo → Settings → Pages → Build and deployment →
#   Source: "Deploy from a branch"  ·  Branch: gh-pages  ·  Folder: / (root)  → Save
# After that, the site auto-updates at https://<org>.github.io/<repo>/ on every push.

on:
  push:
    branches:
      - main
      - claude/website-build-github-924ize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build site (project sub-path)
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add .nojekyll
        run: touch _site/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
