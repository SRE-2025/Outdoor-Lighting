name: Build check

# Verifies the site builds on every push and pull request.

on:
  push:
    branches-ignore: [main]   # main is covered by the Pages/AWS deploys
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Confirm output
        run: test -f _site/index.html && test -f _site/sitemap.xml
